[project]
name = "ticketpulse"
version = "1.0.0"
description = "Real-time ticket booking & payment analytics on AWS (Kinesis, Glue Streaming, Redshift Serverless, n8n + OpenRouter)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "glue", "producer", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]
