AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TicketPulse | 01 network - VPC with public/private subnets across 2 AZs, egress (NAT or VPC
  interface endpoints), S3 gateway endpoint, Kinesis interface endpoint and the security groups
  used by Glue and Redshift Serverless.

Parameters:
  ProjectName:
    Type: String
    Default: ticketpulse
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  EgressMode:
    Type: String
    Default: NAT
    AllowedValues: [NAT, ENDPOINTS]
    Description: >
      NAT = one NAT gateway (cheapest for a demo, ~USD 0.045/h). ENDPOINTS = no internet egress
      from private subnets; interface endpoints for SQS, Secrets Manager, Glue, STS, CloudWatch.

Conditions:
  UseNat: !Equals [!Ref EgressMode, NAT]
  UseEndpoints: !Equals [!Ref EgressMode, ENDPOINTS]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public-a" }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public-b" }]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-private-a" }]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-private-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc, Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public-rt" }] }
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  NatEip:
    Type: AWS::EC2::EIP
    Condition: UseNat
    DependsOn: IgwAttachment
    Properties: { Domain: vpc }
  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: UseNat
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-nat" }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc, Tags: [{ Key: Name, Value: !Sub "${ProjectName}-private-rt" }] }
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: UseNat
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }
  PrivateAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  # ---------- Security groups ----------
  GlueSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Glue streaming job ENIs (Glue requires a self-referencing all-TCP rule)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: "AWS APIs via NAT/endpoints" }
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-glue-sg" }]
  GlueSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GlueSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref GlueSecurityGroup
      Description: Glue worker-to-worker traffic

  RedshiftSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redshift Serverless workgroup - only Glue may connect on 5439
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5439
          ToPort: 5439
          SourceSecurityGroupId: !Ref GlueSecurityGroup
          Description: Glue JDBC
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-redshift-sg" }]

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface VPC endpoints - HTTPS from inside the VPC
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref VpcCidr }
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-vpce-sg" }]

  # ---------- VPC endpoints ----------
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # Required by Glue when a connection is attached to a job whose source is Kinesis.
  KinesisEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kinesis-streams"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  SqsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sqs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
  GlueEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.glue"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
  StsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
  MonitoringEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.monitoring"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${ProjectName}-VpcId" }
  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
    Export: { Name: !Sub "${ProjectName}-PrivateSubnetA" }
  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
    Export: { Name: !Sub "${ProjectName}-PrivateSubnetB" }
  PrivateSubnetAAz:
    Value: !GetAtt PrivateSubnetA.AvailabilityZone
    Export: { Name: !Sub "${ProjectName}-PrivateSubnetAAz" }
  GlueSecurityGroupId:
    Value: !Ref GlueSecurityGroup
    Export: { Name: !Sub "${ProjectName}-GlueSgId" }
  RedshiftSecurityGroupId:
    Value: !Ref RedshiftSecurityGroup
    Export: { Name: !Sub "${ProjectName}-RedshiftSgId" }
