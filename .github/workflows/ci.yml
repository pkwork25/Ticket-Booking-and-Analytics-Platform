name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to AWS after tests (needs AWS_DEPLOY_ROLE_ARN secret)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # for GitHub OIDC -> AWS IAM role (no long-lived keys)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10", cache: pip }   # same Python as Glue 4.0
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "11" }   # for PySpark tests
      - run: pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check .
      - name: Lint CloudFormation
        run: cfn-lint infra/*.yaml
      - name: Unit + Spark tests
        run: pytest -q
      - name: Package artifacts
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with: { name: build, path: build/ }

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: test
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install boto3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - run: ./scripts/deploy.sh
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          OPS_EMAIL: ${{ vars.OPS_EMAIL }}
